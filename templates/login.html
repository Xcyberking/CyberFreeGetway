<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Login — Famnify</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}"></head>
<body class="auth-body">
<div class="auth-card">
  <h2>Welcome back</h2>
  <p class="muted">Login to your Famnify account</p>
  <form id="f">
    <input type="email" id="email" placeholder="Email" required>
    <input type="password" id="password" placeholder="Password" required>
    <button class="btn btn-primary btn-full" type="submit">Login</button>
  </form>
  <p class="muted" style="margin-top:14px">No account? <a href="/signup">Sign up</a></p>
  <p id="err" class="err"></p>
</div>
<script>
document.getElementById('f').addEventListener('submit', async e => {
  e.preventDefault();
  const r = await fetch('/api/auth/login', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({
      email: document.getElementById('email').value,
      password: document.getElementById('password').value,
    })
  });
  const d = await r.json();
  if (!r.ok) { document.getElementById('err').textContent = d.error || 'Login failed'; return; }
  localStorage.setItem('token', d.token);
  location.href = d.user.is_admin ? '/admin' : '/dashboard';
});
</script>
</body></html>
