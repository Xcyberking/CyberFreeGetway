<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Sign Up — Famnify</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}"></head>
<body class="auth-body">
<div class="auth-card">
  <h2>Create account</h2>
  <p class="muted">50 free queries included</p>
  <form id="f">
    <input type="text" id="name" placeholder="Full name">
    <input type="email" id="email" placeholder="Email" required>
    <input type="password" id="password" placeholder="Password (min 6)" required>
    <button class="btn btn-primary btn-full" type="submit">Sign Up</button>
  </form>
  <p class="muted" style="margin-top:14px">Have account? <a href="/login">Login</a></p>
  <p id="err" class="err"></p>
</div>
<script>
document.getElementById('f').addEventListener('submit', async e => {
  e.preventDefault();
  const r = await fetch('/api/auth/signup', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({
      full_name: document.getElementById('name').value,
      email: document.getElementById('email').value,
      password: document.getElementById('password').value,
    })
  });
  const d = await r.json();
  if (!r.ok) { document.getElementById('err').textContent = d.error || 'Signup failed'; return; }
  localStorage.setItem('token', d.token);
  location.href = '/dashboard';
});
</script>
</body></html>
